<script>

var consoleEl=document.getElementById('console');

try{
Error.stackTraceLimit=400;
}catch(e){}

var gdQuality=new URLSearchParams(location.search).get('quality');
var gdLowMemory=gdQuality==='low'||(gdQuality!=='high'&&navigator.deviceMemory>0&&navigator.deviceMemory<=4);
if(gdLowMemory){
var gdCanvas=document.getElementById('canvas');
if(gdCanvas){
gdCanvas.width=1280;
gdCanvas.height=720;
}
}

var GD_DEBUG=/[?&]debug(=|&|$)/.test(location.search);

if(!GD_DEBUG){

try{
console.log=console.info=console.debug=function(){};
}catch(e){}

consoleEl.style.display='none';
}

var logQueue=[];
var logScheduled=false;

window.gdLogRaw=[];

var GD_LOG_DOM_MAX=4000;

window.gdLogDump=function(){
return window.gdLogRaw.join('\n');
};

function flushLog(){

logScheduled=false;

if(!logQueue.length)return;

var frag=document.createDocumentFragment();

for(var i=0;i<logQueue.length;i++){

var line=document.createElement('div');

line.textContent=logQueue[i];

frag.appendChild(line);
}

logQueue=[];

var nearBottom=
consoleEl.scrollHeight-
consoleEl.scrollTop-
consoleEl.clientHeight<40;

consoleEl.appendChild(frag);

while(consoleEl.childNodes.length>GD_LOG_DOM_MAX)
consoleEl.removeChild(consoleEl.firstChild);

if(nearBottom)
consoleEl.scrollTop=consoleEl.scrollHeight;
}

var seenDep=Object.create(null);

var QUIET=[
'[perf]','[frame]','[webgl]','[io]','[tex]','[pngc]',
'[pngd]','[fmtf]','[sink]','[htb]','[disp]','[rawin]',
'[touch]','[cte]','[list]','[drs]','[tex2]'
];

function isQuiet(str){

for(var i=0;i<QUIET.length;i++)
if(str.lastIndexOf(QUIET[i],0)===0)
return true;

return false;
}

function say(s){

if(!GD_DEBUG)return;

var str=String(s);

if(!isQuiet(str))
console.log(s);

if(
str.indexOf('dependency: ')===0||
str.indexOf('still waiting on run dependencies')===0||
str==='(end of list)'
){

if(seenDep[str])return;

seenDep[str]=1;
}

window.gdLogRaw.push(str);

if(window.gdLogRaw.length>400000)
window.gdLogRaw.splice(0,100000);

logQueue.push(str);

if(!logScheduled){

logScheduled=true;

requestAnimationFrame(flushLog);
}
}

var gdProg=0;
var gdProgDone=false;

var gdAssetDone={
wasm:false,
data:false
};

var gdAssetsFell=false;

var wasmFill=document.getElementById('wasmFill');
var dataFill=document.getElementById('dataFill');

var wasmPct=document.getElementById('wasmPct');
var dataPct=document.getElementById('dataPct');

var wasmLabel=document.getElementById('wasmLabel');
var dataLabel=document.getElementById('dataLabel');

var bootFill=document.getElementById('bootFill');
var bootPct=document.getElementById('bootPct');

function gdFmtSize(n){

if(!n)return '0 MB';

if(n<1048576)
return Math.round(n/1024)+' KB';

return (n/1048576).toFixed(1)+' MB';
}

function gdFormatBytes(n){
return gdFmtSize(n);
}

/*
 * FULL FILE SIZES
 *
 * WASM = 70,192,990 bytes
 * DATA = 314,500,859 bytes
 */

var GD_SIZE_HINT={
wasm:70192990,
data:314500859
};

var GD_BUILD_ID='a6f253af4d4bd0a4';

var GD_ASSET_CACHE='gdwasm-assets-v2';

/*
 * SPLIT FILE LOADER (Parallel & Persistent Cache)
 *
 * gd_web.wasm: 4 chunks
 * gd_web.data: 15 chunks
 *
 * Chunks are loaded concurrently in parallel and cached in Cache API for instant reloads.
 */

var GD_SPLIT_COUNTS={
wasm:4,
data:15
};

function gdLoadSplitFile(which,onProgress){

var base=which==='wasm'?'gd_web.wasm':'gd_web.data';
var count=GD_SPLIT_COUNTS[which];
var expectedTotal=GD_SIZE_HINT[which]||0;
var cacheKey='https://gdwasm.local/cached/'+which+'_'+GD_BUILD_ID;

function fetchFromNetwork(){
var loadedBytesByChunk=new Array(count).fill(0);
var chunks=new Array(count);

function reportOverallProgress(){
if(!onProgress)return;
var sum=0;
for(var k=0; k<loadedBytesByChunk.length; k++) sum += loadedBytesByChunk[k];
onProgress(sum,expectedTotal);
}

function fetchChunkWithRetry(url, i, retriesLeft){
say('['+which+'] fetching '+url+' (parallel)');
return fetch(url).then(function(r){
if(!r.ok) throw new Error(url+' HTTP '+r.status);
if(r.body && r.body.getReader){
  var reader = r.body.getReader();
  var partChunks = [];
  function pump(){
    return reader.read().then(function(res){
      if(res.done){
        var partLen = 0;
        for(var p=0; p<partChunks.length; p++) partLen += partChunks[p].length;
        var partArr = new Uint8Array(partLen);
        var pOff = 0;
        for(var p=0; p<partChunks.length; p++){
          partArr.set(partChunks[p], pOff);
          pOff += partChunks[p].length;
        }
        chunks[i] = partArr;
        loadedBytesByChunk[i] = partLen;
        reportOverallProgress();
        return;
      }
      partChunks.push(res.value);
      loadedBytesByChunk[i] += res.value.length;
      reportOverallProgress();
      return pump();
    });
  }
  return pump();
}
return r.arrayBuffer().then(function(buf){
  var arr=new Uint8Array(buf);
  chunks[i]=arr;
  loadedBytesByChunk[i]=arr.byteLength;
  reportOverallProgress();
});
}).catch(function(err){
if(retriesLeft > 0){
  say('['+which+'] retrying '+url+' in 1s ('+retriesLeft+' retries left)...');
  loadedBytesByChunk[i] = 0;
  reportOverallProgress();
  return new Promise(function(resolve){
    setTimeout(function(){
      resolve(fetchChunkWithRetry(url, i, retriesLeft - 1));
    }, 1000);
  });
}
throw err;
});
}

var promises=[];
for(var idx=0;idx<count;idx++){
(function(i){
var partNum=i+1;
var url=base+'.part'+String(partNum).padStart(3,'0');
promises.push(fetchChunkWithRetry(url, i, 3));
})(idx);
}

return Promise.all(promises).then(function(){
var total=chunks.reduce(function(acc,c){return acc+c.byteLength;},0);
var combined=new Uint8Array(total);
var offset=0;
for(var y=0;y<chunks.length;y++){
combined.set(chunks[y],offset);
offset+=chunks[y].byteLength;
}

say('['+which+'] complete! Assembled '+gdFormatBytes(total));

if(window.caches){
caches.open(GD_ASSET_CACHE).then(function(cache){
cache.put(new Request(cacheKey),new Response(combined,{
headers:{
'Content-Type':'application/octet-stream',
'Content-Length':String(total)
}
})).catch(function(){});
}).catch(function(){});
}

return combined.buffer;
});
}

if(window.caches){
return caches.open(GD_ASSET_CACHE).then(function(cache){
return cache.match(cacheKey).then(function(matched){
if(matched){
say('['+which+'] loading instantly from disk cache!');
return matched.arrayBuffer().then(function(buf){
if(onProgress)onProgress(buf.byteLength,buf.byteLength);
return buf;
});
}
return fetchFromNetwork();
});
}).catch(function(){
return fetchFromNetwork();
});
}

return fetchFromNetwork();
}

function gdInstallSplitFetch(){

var nativeFetch=window.fetch.bind(window);

window.fetch=function(input,init){

var u=typeof input==='string'
?input
:(input&&input.url)||'';

var clean=u.split('?')[0].split('#')[0];

if(
clean==='gd_web.data'||
clean.endsWith('/gd_web.data')
){

return gdLoadSplitFile('data',function(loaded,total){

try{
setAssetBar('data',loaded,total);
}catch(e){}

}).then(function(ab){

return new Response(ab,{
status:200,
headers:{
'Content-Type':'application/octet-stream',
'Content-Length':String(ab.byteLength)
}
});
});
}

return nativeFetch(input,init);
};
}

gdInstallSplitFetch();

function gdClearCache(){

if(!confirm(
'Clear saved progress and login on this site?\n'+
'The game reloads afterwards.'
))
return;

try{

if(Module&&Module._gd_autosave_set)
Module._gd_autosave_set(0);

}catch(e){}

var jobs=[];

if(window.caches)
jobs.push(caches.delete(GD_ASSET_CACHE));

jobs.push(new Promise(function(res){

try{

var r=indexedDB.deleteDatabase('gdwasm_saves');

r.onsuccess=
r.onerror=
r.onblocked=function(){
res();
};

}catch(e){
res();
}
}));

try{

localStorage.removeItem('gdWasmSize');
localStorage.removeItem('gdDataSize');
localStorage.removeItem('gdwasm_save_CCGameManager.dat');
localStorage.removeItem('gdwasm_save_CCLocalLevels.dat');
localStorage.removeItem('gdwasm_save_AppData/CCGameManager.dat');
localStorage.removeItem('gdwasm_save_AppData/CCLocalLevels.dat');

}catch(e){}

Promise.all(jobs).then(
function(){location.reload();},
function(){location.reload();}
);
}

function gdSizeHint(which){

return which==='wasm'
?GD_SIZE_HINT.wasm
:GD_SIZE_HINT.data;
}

function gdLearnedSize(which){

try{

return Number(
localStorage.getItem(
which==='wasm'
?'gdWasmSize'
:'gdDataSize'
)
)||0;

}catch(e){
return 0;
}
}

function setAssetBar(which,loaded,total){

var fill=
which==='wasm'
?wasmFill
:dataFill;

var pctEl=
which==='wasm'
?wasmPct
:dataPct;

var label=
which==='wasm'
?wasmLabel
:dataLabel;

if(!fill)return;

var name=
which==='wasm'
?'WASM'
:'DATA';

var learned=gdLearnedSize(which);

var hint=gdSizeHint(which);

var known=hint>0
?hint
:(learned>0
?learned
:(total>0
?total
:0));

var exact=known>0;

if(label){

label.textContent=
name+' ('+
(exact?'':'~')+
gdFmtSize(known>0
?known
:(which==='wasm'
?110*1024*1024
:320*1024*1024))+
')';
}

var p;

if(known>0)
p=Math.min(100,loaded/known*100);
else{

var est=
which==='wasm'
?110*1024*1024
:320*1024*1024;

p=Math.min(95,loaded/est*95);
}

fill.style.width=p.toFixed(1)+'%';

if(loaded<=0)
pctEl.textContent='0%';

else if(known>0)
pctEl.textContent=
p.toFixed(0)+'% ('+
gdFmtSize(loaded)+')';

else
pctEl.textContent=gdFmtSize(loaded);

if(known>0&&loaded>=known){

gdAssetDone[which]=true;

try{

localStorage.setItem(
which==='wasm'
?'gdWasmSize'
:'gdDataSize',
String(Math.max(loaded,known))
);

}catch(e){}
}

if(gdAssetDone.wasm&&gdAssetDone.data)
assetsDone();
}

function forceAssetsDone(){

gdAssetDone.wasm=true;
gdAssetDone.data=true;

setAssetBar('wasm',1,1);
setAssetBar('data',1,1);

assetsDone();
}

function assetsDone(){

if(gdAssetsFell)return;

gdAssetsFell=true;

var bars=document.getElementById('bars');
var boot=document.getElementById('bootbars');

if(bars)
bars.classList.add('fall');

setTimeout(function(){

if(bars)
bars.style.display='none';

if(boot)
boot.classList.add('on');

},520);
}

function bootDone(){

var boot=document.getElementById('bootbars');

if(!boot||boot.classList.contains('done'))
return;

boot.classList.add('done');

setTimeout(function(){
boot.style.display='none';
},520);
}

function setProgress(p,exact){

if(gdProgDone&&p<100)
return;

p=Math.max(0,Math.min(100,p));

if(p<gdProg&&!exact)
return;

gdProg=p;

if(bootFill)
bootFill.style.width=p.toFixed(1)+'%';

if(bootPct)
bootPct.textContent=p.toFixed(0)+'%';

if(p>=100){

gdProgDone=true;
bootDone();
if(typeof gdProgressTimer!=='undefined'&&gdProgressTimer){
clearInterval(gdProgressTimer);
gdProgressTimer=null;
}
}
}

function resetProgress(){

gdProgDone=false;
gdProg=0;
gdAssetsFell=false;
if(typeof gdProgressTimer!=='undefined'&&!gdProgressTimer&&typeof gdProgressTick==='function'){
gdProgressTimer=setInterval(gdProgressTick,200);
}

gdAssetDone={
wasm:false,
data:false
};

var bars=document.getElementById('bars');
var boot=document.getElementById('bootbars');

if(bars){

bars.style.display='';
bars.classList.remove('fall');
}

if(boot){

boot.classList.remove('on');
boot.classList.remove('done');
}

setAssetBar(
'wasm',
0,
gdLearnedSize('wasm')
);

setAssetBar(
'data',
0,
gdLearnedSize('data')
);

if(bootFill)
bootFill.style.width='0%';

if(bootPct)
bootPct.textContent='0%';
}

window.gdFirstFrame=function(){

forceAssetsDone();
setProgress(100);
};

var gdSaveTimer=null;
var gdLastSave=0;
var gdToastTimer=null;
var gdProgressTimer=null;

function gdBytesToBase64(u8){
if(!u8||!u8.byteLength) return '';
var CHUNK=0x8000;
var chunks=[];
for(var i=0;i<u8.byteLength;i+=CHUNK){
chunks.push(String.fromCharCode.apply(null, u8.subarray(i, i+CHUNK)));
}
return btoa(chunks.join(''));
}

window.__gdLastSavePersistTime=0;
window.__gdOnSavePersisted=function(nm, bytes){
window.__gdLastSavePersistTime=Date.now();
};

function showSaveToast(msg, isError){
var t=document.getElementById('saveToast');
if(!t) return;
t.textContent=msg;
t.className='save-toast'+(isError?' error':'')+' show';
if(gdToastTimer) clearTimeout(gdToastTimer);
gdToastTimer=setTimeout(function(){
t.classList.remove('show');
}, 2800);
}

function gdPerformSave(showToast){
if(window.__gdPreventSave) return false;
if(!window.__gdRuntimeReady||!window.Module) return false;
try{
var beforeTime=Date.now();
if(Module._gd_request_save)
Module._gd_request_save();

var wasPersisted=(window.__gdLastSavePersistTime&&window.__gdLastSavePersistTime>=beforeTime);

if(!wasPersisted&&Module.FS){
var saveFiles=['CCGameManager.dat','CCLocalLevels.dat'];
saveFiles.forEach(function(fname){
var paths=['/Resources/'+fname, fname, '/AppData/'+fname];
for(var i=0; i<paths.length; i++){
try{
var data=Module.FS.readFile(paths[i]);
if(data&&data.byteLength>0){
try{
if(data.byteLength < 4 * 1024 * 1024){
var b64=gdBytesToBase64(data);
localStorage.setItem('gdwasm_save_'+fname, b64);
localStorage.setItem('gdwasm_save_AppData/'+fname, b64);
}
}catch(e){}
try{
var req=indexedDB.open('gdwasm_saves', 1);
req.onupgradeneeded=function(){
req.result.createObjectStore('files');
};
req.onsuccess=function(){
try{
var tx=req.result.transaction('files','readwrite');
var store=tx.objectStore('files');
store.put(data, 'AppData/'+fname);
store.put(data, fname);
}catch(e){}
};
}catch(e){}
break;
}
}catch(e){}
}
});
}
gdLastSave=Date.now();
if(showToast){
showSaveToast('Game progress saved!');
}
return true;
}catch(e){
say('[save] error: '+e);
if(showToast){
showSaveToast('Save error: '+e, true);
}
return false;
}
}

window.__gdLastInputTime=Date.now();
function gdRecordInputActivity(){
window.__gdLastInputTime=Date.now();
}
window.addEventListener('keydown', gdRecordInputActivity, true);
window.addEventListener('mousedown', gdRecordInputActivity, true);
window.addEventListener('touchstart', gdRecordInputActivity, true);

var gdSaveScheduledAt=0;

function scheduleSave(now){
if(!window.__gdRuntimeReady) return;
if(gdSaveTimer) clearTimeout(gdSaveTimer);
if(now){
gdSaveTimer=null;
gdPerformSave(false);
return;
}
gdSaveScheduledAt=Date.now();
gdSaveTimer=setTimeout(function(){
gdSaveTimer=null;
var nowTime=Date.now();
if(nowTime-gdLastSave<10000) return;
// If the player pressed any jump/movement inputs SINCE this save was scheduled,
// they are actively playing! Defer saving so active jumps are never frozen.
if(window.__gdLastInputTime>gdSaveScheduledAt) return;
gdPerformSave(false);
}, 2000);
}

// Background idle autosave check:
// Runs every 15s, but only saves if:
// 1. The player has been idle/inactive for at least 6 seconds
// 2. At least 60 seconds have elapsed since the last save
// This ensures active jumps and level runs are NEVER interrupted by sudden freezes.
setInterval(function(){
if(!window.__gdRuntimeReady) return;
var now=Date.now();
if(now-window.__gdLastInputTime<6000) return;
if(now-gdLastSave<60000) return;
gdPerformSave(false);
}, 15000);

window.addEventListener('beforeunload', function(){
gdPerformSave(false);
});
window.addEventListener('pagehide', function(){

function writeSaveToModuleFS(rawKey, uint8Data){
if(!Module.FS||!uint8Data||!uint8Data.byteLength) return;
var rawStr=String(rawKey);
var cleanName=rawStr.replace(/^AppData\//i,'').replace(/^\/+/,'');
var targets=[
'/Resources/'+cleanName,
'/'+cleanName,
'/AppData/'+cleanName,
'/AppData/Local/GeometryDash/'+cleanName
];
targets.forEach(function(dest){
try{
var parts=dest.split('/');
var cur='';
for(var i=1;i<parts.length-1;i++){
cur+='/'+parts[i];
try{
Module.FS.stat(cur);
}catch(e1){
try{Module.FS.mkdir(cur);}catch(e2){}
}
}
Module.FS.writeFile(dest,uint8Data);
}catch(err){
say('[persist] writeFile '+dest+' err: '+err);
}
});
say('[persist] restored '+cleanName+' ('+uint8Data.byteLength+' bytes) to /Resources and /AppData');
}

function restoreFromLocalStorage(){
var count=0;
var saveFiles=['CCGameManager.dat','CCLocalLevels.dat'];
saveFiles.forEach(function(fname){
var b64=localStorage.getItem('gdwasm_save_'+fname)||localStorage.getItem('gdwasm_save_AppData/'+fname);
if(b64){
try{
var bin=atob(b64);
var u8=new Uint8Array(bin.length);
for(var i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
writeSaveToModuleFS(fname,u8);
count++;
try{
var req=indexedDB.open('gdwasm_saves',1);
req.onsuccess=function(){
try{
var tx=req.result.transaction('files','readwrite');
var store=tx.objectStore('files');
store.put(u8,'AppData/'+fname);
store.put(u8,fname);
}catch(e){}
};
}catch(e){}
}catch(e){
say('[persist] localStorage restore '+fname+' err: '+e);
}
}
});
return count;
}

function restoreSaves(then){

var called=false;

function finish(){
if(!called){
called=true;
then();
}
}

setTimeout(finish,3000);

try{

var req=indexedDB.open('gdwasm_saves',1);

req.onupgradeneeded=function(){
req.result.createObjectStore('files');
};

req.onerror=function(){
say('[persist] idb open failed, trying localStorage');
restoreFromLocalStorage();
finish();
};

req.onsuccess=function(){

var store,keysReq;

try{
store=req.result
.transaction('files','readonly')
.objectStore('files');

keysReq=store.getAllKeys();
}catch(e){
restoreFromLocalStorage();
finish();
return;
}

keysReq.onerror=function(){
restoreFromLocalStorage();
finish();
};

keysReq.onsuccess=function(){

var keys=keysReq.result||[];

say(
'[persist] restore: '+
keys.length+
' file(s) in DB'+
(keys.length?': '+keys.join(', '):'')
);

if(!keys.length){
restoreFromLocalStorage();
finish();
return;
}

var pending=keys.length;

function one(){
if(--pending===0){
// Fallback check: if any standard save file is missing in DB, check localStorage
['CCGameManager.dat','CCLocalLevels.dat'].forEach(function(f){
var hasF=keys.some(function(k){
return String(k).indexOf(f)!==-1;
});
if(!hasF){
var b64=localStorage.getItem('gdwasm_save_'+f);
if(b64){
try{
var bin=atob(b64);
var u8=new Uint8Array(bin.length);
for(var i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
writeSaveToModuleFS(f,u8);
}catch(e){}
}
}
});
finish();
}
}

keys.forEach(function(k){

var g=store.get(k);

g.onerror=one;

g.onsuccess=function(){

try{

if(g.result&&g.result.byteLength){
var u8=new Uint8Array(g.result);
writeSaveToModuleFS(k,u8);

try{
var clean=String(k).replace(/^AppData\//i,'').replace(/^\/+/,'');
if(u8.byteLength < 4 * 1024 * 1024){
localStorage.setItem('gdwasm_save_'+clean, gdBytesToBase64(u8));
}
}catch(e){}
}

}catch(e){
say('[persist] restore '+k+': '+e);
}

one();
};

});
};
};

}catch(e){
restoreFromLocalStorage();
finish();
}
}

var files=json.files||json;
var importedAny=false;
['CCGameManager.dat','CCLocalLevels.dat'].forEach(function(fname){
var b64=files[fname]||files['AppData/'+fname];
if(b64){
var bin=atob(b64);
var u8=new Uint8Array(bin.length);
for(var i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
localStorage.setItem('gdwasm_save_'+fname,b64);
localStorage.setItem('gdwasm_save_AppData/'+fname,b64);
try{
var req=indexedDB.open('gdwasm_saves',1);
req.onsuccess=function(){
try{
var tx=req.result.transaction('files','readwrite');
tx.objectStore('files').put(u8,'AppData/'+fname);
tx.objectStore('files').put(u8,fname);
}catch(e){}
};
}catch(e){}
if(window.Module&&Module.FS){
writeSaveToModuleFS(fname,u8);
}
importedAny=true;
}
});
if(importedAny){

};

tx.objectStore('files').put(u8,fname);

};
}catch(e){}

  function readAcct(xml){
    var n=/<k>GJA_001<\/k><s>([^<]*)<\/s>/.exec(xml), id=/<k>GJA_003<\/k><i>(\d+)<\/i>/.exec(xml);
    return n&&id?{name:n[1],accountID:id[1]}:null;
  }
  function editAcct(xml,a){
    xml=xml.replace(/<k>GJA_00[1-9]<\/k>(?:<(\w)>[^<]*<\/\1>|<\w ?\/>)/g,'');
    if(!a) return xml;
    var add='<k>GJA_001</k><s>'+a.name+'</s>';
    if(a.pw){
      add+='<k>GJA_002</k><s>'+gdXorPw(a.pw)+'</s>';
    }
    add+='<k>GJA_003</k><i>'+a.accountID+'</i><k>GJA_005</k><s>'+a.hash+'</s>';
    var end=xml.lastIndexOf('</dict></plist>'); if(end<0) throw new Error('Unexpected save format');
    xml=xml.slice(0,end)+add+xml.slice(end);
    function setKey(k,tag,v){
      var re=new RegExp('(<k>'+k+'</k>)<'+tag+'>[^<]*</'+tag+'>');
      if(re.test(xml)) xml=xml.replace(re,'$1<'+tag+'>'+v+'</'+tag+'>');
      else{ var e2=xml.lastIndexOf('</dict></plist>'); xml=xml.slice(0,e2)+'<k>'+k+'</k><'+tag+'>'+v+'</'+tag+'>'+xml.slice(e2); }
    }
    setKey('playerName','s',a.name);
    setKey('playerUserID','i',a.userID);
    return xml;
  }

if(window.__gdInputReady!==true)
return;

try{

Module.gdInputQueue.push([
0x202,
0,
(Module.gdCursorPos[0]&0xffff)|
(Module.gdCursorPos[1]<<16)
]);

}catch(_){}

e.preventDefault();

},
{passive:false}
);

}

window.addEventListener(
'error',
function(e){

if(
e&&
e.message&&
/JSPI|WebAssembly|wasm|memory/i.test(
String(e.message)
)
)

err(
'Runtime error: '+e.message
);

}
);

})();
</script>

</body>
</html>
